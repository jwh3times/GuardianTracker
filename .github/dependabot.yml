# Dependabot configuration for Guardian Tracker.
#
# Minor/patch updates are grouped into a single PR per ecosystem to reduce noise;
# MAJOR bumps arrive individually — EXCEPT for peer-locked families where a lone
# bump would leave an unsatisfiable peer range. Those families travel together as
# one major PR.
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # ── Go modules (backend/api-service — Go 1.25.x) ──
  - package-ecosystem: "gomod"
    directory: "/backend/api-service"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── npm (frontend — Vite/React) ──
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    groups:
      # --- Peer-locked families — majors only. All minor/patch bumps land in the
      #     catch-all group at the bottom. ---

      # react + react-dom ship at identical versions and must match at runtime;
      # the @types/* packages track the same major.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"

      # All @radix-ui/* primitives share a peer-requirement on the same React major
      # and are developed in the same monorepo — major bumps typically ship together.
      radix-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "major"

      # @vitejs/plugin-react requires a matching Vite major; vitest and @vitest/*
      # track the Vite majors they support.
      vite-ecosystem:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/plugin-react"
          - "@vitest/*"
        update-types:
          - "major"

      # @testing-library/react and user-event both peer-require @testing-library/dom.
      testing-library:
        patterns:
          - "@testing-library/*"
        update-types:
          - "major"

      # @eslint/js is lockstep-versioned with eslint; plugins peer-cap on the eslint
      # major; typescript-eslint peer-bounds both eslint and typescript.
      lint-and-typescript:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
          - "typescript-eslint"
          - "globals"
          - "typescript"
        update-types:
          - "major"

      # One PR for all minor + patch bumps; ungrouped majors open individually.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions (.github/workflows/) ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── Docker base images (frontend/Dockerfile, frontend/Dockerfile.dev,
  #    backend/api-service/Dockerfile) ──
  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/backend/api-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── Docker Compose images (docker-compose.yml — postgres, redis, pgadmin) ──
  # Separate ecosystem from `docker`; the docker scanner only reads Dockerfiles.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    groups:
      compose-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
