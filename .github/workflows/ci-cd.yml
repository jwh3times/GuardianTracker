name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "26"
  GO_VERSION: "1.25.11"

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  test-go-services:
    name: Test Go Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test API Service
        working-directory: ./backend/api-service
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          go mod tidy
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          go test -race -coverprofile=coverage.out ./...

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-go-services]

    # Build-only validation: confirms every Dockerfile builds on each push/PR.
    # No registry login or push yet — there is no Docker Hub account / deploy
    # target. When one exists, add a docker/login-action step with
    # DOCKER_USERNAME/DOCKER_PASSWORD secrets and flip `push` to true (gated on
    # `github.ref == 'refs/heads/main'`), then re-add the deploy jobs.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: guardiantracker/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API Service image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/api-service
          file: ./backend/api-service/Dockerfile
          push: false
          tags: guardiantracker/api-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
