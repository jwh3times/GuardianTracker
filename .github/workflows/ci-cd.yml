name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Minimal default token scope for every job: these jobs only read the repo
# (checkout), run tests, and build images locally — none push or write back.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  GO_VERSION: "1.26.5"

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    # Single formatting gate for the whole repo, in three parts. Fix locally with:
    #   frontend/     -> `npm run format`                    (from frontend/)
    #   repo markdown -> `./frontend/node_modules/.bin/prettier --write "**/*.md"`
    #                                                        (from the repo root)
    #   Go services   -> `gofmt -w .`                        (from backend/api-service/)
    # The markdown step runs from the repo root so it also covers docs/, .claude/,
    # k8s/, and the root *.md files, which the frontend-scoped run cannot reach. It
    # reuses the frontend's Prettier install rather than adding a second package.json.
    # The root .gitignore (private/, docs/superpowers/, node_modules/) and the root
    # .prettierignore (frontend/design) decide what is skipped.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check Prettier formatting (frontend)
        working-directory: ./frontend
        run: npm run format:check

      # Runs from the repo root (no working-directory) so the glob reaches
      # markdown outside frontend/ — README, SETUP, docs/, .claude/, k8s/.
      - name: Check Prettier formatting (repo markdown)
        run: ./frontend/node_modules/.bin/prettier --check "**/*.md"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check gofmt (Go services)
        working-directory: ./backend/api-service
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These Go files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' in backend/api-service to fix."
            exit 1
          fi
          echo "All Go files are gofmt-formatted."

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      # Coverage thresholds are enforced by vitest (vite.config.ts
      # test.coverage.thresholds) — the run fails if they regress.
      - name: Run tests with coverage gate
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  test-go-services:
    name: Test Go Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # TEST_DATABASE_URL (not DATABASE_URL) gates the db integration tests.
      # DATABASE_URL stays unset on purpose: unit tests must exercise the
      # degraded (no-DB) code paths, not silently connect to Postgres.
      - name: Test API Service
        working-directory: ./backend/api-service
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable
        run: |
          go mod tidy
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          go test -race -coverprofile=coverage.out ./...

      # Floor for the current suite. CI runs with cgo (race) + Postgres, so the
      # sqlite manifest/search and db integration tests count here — total lands
      # ~63% (vs ~52% locally where those packages are skipped; reproduce the CI
      # number with backend/api-service/test-local.ps1). Gate is set a few points
      # under the CI actual for headroom; ratchet upward as it grows.
      - name: Enforce Go coverage gate
        working-directory: ./backend/api-service
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 60.0) { print "FAIL: coverage " t "% is below the 60% gate"; exit 1 } }'

      - name: Upload Go coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: backend/api-service/coverage.out
          retention-days: 14

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-go-services]

    # Build-only validation: confirms every Dockerfile builds on each push/PR.
    # No registry login or push yet — there is no Docker Hub account / deploy
    # target. When one exists, add a docker/login-action step with
    # DOCKER_USERNAME/DOCKER_PASSWORD secrets and flip `push` to true (gated on
    # `github.ref == 'refs/heads/main'`), then re-add the deploy jobs.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: guardiantracker/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API Service image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/api-service
          file: ./backend/api-service/Dockerfile
          push: false
          tags: guardiantracker/api-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  changelog-version:
    name: Changelog Version
    runs-on: ubuntu-latest

    # Guards that CHANGELOG.md's top version equals the tag this merge will mint.
    # Without this, a PR can be written against a version number that another PR
    # takes first, and the changelog silently disagrees with the tags.
    #
    # PR-only: on a push to main the merge is already tagged, so "next version"
    # is necessarily one ahead of the changelog and the check would always fail.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are required to compute the next version

      - name: Test the next-version oracle
        run: bash scripts/next-version.test.sh

      - name: Verify CHANGELOG's top version matches the tag this merge will mint
        env:
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          # Bot PRs (dependabot) never touch CHANGELOG.md. Requiring an entry would
          # block them permanently, so they are exempt — /ship backfills the entry for
          # their version on its next run. Exempting here is safe only because of that
          # backfill; without it the changelog silently loses a version, which is
          # exactly how v0.3.16, v0.3.17 and v0.3.21 went undocumented.
          if [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            echo "Bot-authored PR; /ship backfills its changelog entry after merge. Skipping."
            exit 0
          fi

          expected=$(bash scripts/next-version.sh)
          actual=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -1)

          if [ -z "$actual" ]; then
            echo "::error::CHANGELOG.md contains no versioned section (expected a '## [x.y.z] - date' heading)."
            exit 1
          fi

          if [ "$actual" != "$expected" ]; then
            echo "::error::CHANGELOG.md's top version is ${actual}, but merging this PR will mint v${expected}. Rebase onto main and re-run /ship."
            exit 1
          fi

          echo "CHANGELOG top version ${actual} matches the tag this merge will mint."
