name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "26"
  GO_VERSION: "1.25"

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  test-graphql:
    name: Test GraphQL Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/graphql-service/package-lock.json

      - name: Install dependencies
        working-directory: ./backend/graphql-service
        run: npm ci

      - name: Run type check
        working-directory: ./backend/graphql-service
        run: npm run type-check

      - name: Run linting
        working-directory: ./backend/graphql-service
        run: npm run lint

      - name: Run tests
        working-directory: ./backend/graphql-service
        run: npm test

      - name: Build GraphQL server
        working-directory: ./backend/graphql-service
        run: npm run build

  test-go-services:
    name: Test Go Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test Auth Service
        working-directory: ./backend/auth-service
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          go mod tidy
          go vet ./...
          go test -race -coverprofile=coverage.out ./...

      - name: Test Bungie Service
        working-directory: ./backend/bungie-service
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          go mod tidy
          go vet ./...
          go test -race -coverprofile=coverage.out ./...

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-graphql, test-go-services]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: guardiantracker/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push GraphQL image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/graphql-service
          file: ./backend/graphql-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: guardiantracker/graphql-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Auth Service image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/auth-service
          file: ./backend/auth-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: guardiantracker/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Bungie Service image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/bungie-service
          file: ./backend/bungie-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: guardiantracker/bungie-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/staging/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/production/
