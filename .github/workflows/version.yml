name: Version

# Stamps every merge to main with a three-part SemVer release.
#
# On each push to main this reads the target version from the root VERSION file,
# treats the third component as the project build number, pushes an annotated tag
# `v<major>.<minor>.<build>` (e.g. v1.2.0) pointing at the merge commit, and
# creates a GitHub Release from that tag.
#
# Why a tag instead of committing a bump back to main:
#   - it works identically on protected branches (no bypass actor or bump-commit needed);
#   - it never re-triggers CI or needs [skip ci] loops;
#   - build numbers can restart at 0 whenever the major/minor version is bumped.
#
# If VERSION is bumped to a new major/minor line such as 2.0.0 and there are no
# v2.0.* tags yet, the first release stays v2.0.0. It only increments to v2.0.1
# after a v2.0.0 tag exists.
#
# To see which build a checkout corresponds to: git describe --tags

on:
  push:
    branches: [main]

permissions:
  contents: write # required to push the version tag

# Serialize runs so two closely-spaced merges can't compute the same build number.
concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  tag-build:
    name: Tag and release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, needed to compute the next build number

      - name: Compute next version and push tag
        id: version
        run: |
          target=$(tr -d '[:space:]' < VERSION)
          if ! echo "$target" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::VERSION '$target' is not a plain SemVer x.y.z version."
            exit 1
          fi

          IFS=. read -r major minor configured_build <<< "$target"

          prefix="v${major}.${minor}"
          escaped_prefix="v${major}\.${minor}"
          existing_for_commit=$(git tag --list "${prefix}.*" --points-at "$GITHUB_SHA" | grep -E "^${escaped_prefix}\.[0-9]+$" | sort -V | tail -1 || true)

          if [ -n "$existing_for_commit" ]; then
            tag="$existing_for_commit"
            version="${tag#v}"
            build="${version##*.}"
            echo "Commit already has ${tag}; reusing it instead of creating another build."
          else
            last=$(git tag --list "${prefix}.*" | grep -E "^${escaped_prefix}\.[0-9]+$" | sed -E "s/^${escaped_prefix}\.//" | sort -n | tail -1 || true)

            if [ -z "$last" ]; then
              build="$configured_build"
            elif [ "$configured_build" -gt "$last" ]; then
              build="$configured_build"
            else
              build=$(( last + 1 ))
            fi

            tag="${prefix}.${build}"
            version="${major}.${minor}.${build}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Version ${version}"
            git push origin "refs/tags/${tag}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          {
            echo "### Version tag: \`${tag}\`"
            echo ""
            echo "- Version line: \`${major}.${minor}\`"
            echo "- Build number: \`${build}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

          {
            echo "- GitHub Release: \`${TAG}\`"
            echo "- SemVer: \`${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
