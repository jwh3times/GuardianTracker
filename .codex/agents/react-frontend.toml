## Data fetching

Data fetching uses **TanStack React Query** (`useQuery`) with `apiFetch` from `lib/api.ts`; authenticated mutations use `useIdentityMutation` from `contexts/IdentityMutation.ts`, which wraps React Query mutation lifecycle callbacks with the originating identity guard. There is no Apollo Client.

All eleven membership/console-scoped resources (Wish list, Collections, Weekly,
Characters, Items, Search, Flags, Admin, Catalysts, Crafting, and Seals) are
owned by `src/data/` modules (see "Shared query definitions" below): a module
owns that resource's query identity (key private, never exported), endpoint
path, projection to a domain type, every mutation, and its own invalidation.
**Do not declare a raw inline `useQuery`/`useIdentityMutation` call in a
feature for a resource that already has a `src/data/` module** — read the
module's hook instead. Preferences (`data/preferences.ts`, ADR 0021, E15) is a
twelfth `src/data/` module that owns its resource the same way but deliberately
uses no React Query — see its entry in "File structure" above.

This boundary is machine-enforced, not just convention (ADR 0020, E16):
`.oxlintrc.json` makes `no-restricted-imports` an error for `src/features/**`
and `src/components/**` (their own `.test.{ts,tsx}` files excluded), barring
both `@tanstack/react-query` and any `types/api` import. A feature or component
that imports either fails `npm run lint` in the `Test Frontend` job.

Use `apiFetch` for authenticated REST operations, including Bungie reconnect.
The OAuth starter and initial callback delegate to the shared browser session
client. Its browser transport owns `fetch`, credential attachment, and refresh;
`apiFetch` shapes REST responses/errors and routes Bungie reauthorization.

`ApiError` carries `.status` (HTTP status) and `.code` (backend machine-readable code). Use `errorState(error)` from `lib/errorState.ts` to map errors to UI copy — it branches on `PRIVACY_RESTRICTION`, `MANIFEST_NOT_READY`, `BUNGIE_ERROR`.

**Every view that renders a `useQuery` result must have an `isError` branch that renders `<QueryErrorPanel error={...} onRetry={refetch} />`.** A failed fetch must never fall through to the same-looking empty state as "you have zero of these" — that gap previously shipped on WishList, Admin, This Week, and header search. The one narrow exception is a dropdown-style menu (header search) where a `gt-card` panel would break the container's layout; use a one-line message there instead, matching `AppShell.tsx`'s `SearchBar`.

## Shared query definitions

`data/items.ts` exports the Items resource's two hooks:

- `useItemPerks(itemHash)` — lazy query for weapon perk columns and catalysts (`GET /api/items/:itemHash/perks`); `enabled: !!itemHash`; `staleTime: Infinity` since manifest data doesn't change mid-session. Returns `{ perkColumns, catalysts, isLoading }`. Used by Collections when the item detail drawer opens (click or deep-link).
- `useItemView(itemHash)` — minimal item view (`GET /api/items/:itemHash`); resolves a deep-link miss — a `?item=<hash>` URL with no collectible entry — into a read-only drawer. `enabled: !!itemHash`; `staleTime: Infinity`; `retry: false` (a 404 means the hash is not in the manifest — no value in retrying). Returns `{ item, isError }`. Used by Collections when a deep-link hash cannot be found in any collection bucket.

[ADR 0020](../../docs/adr/0020-own-frontend-data-access.md) has landed all
eleven resources it identified, one PR per resource: Wish list (E4),
Collections (E5), Weekly (E6), Characters (E7), Items (E8), Search (E9), Flags
(E10), Admin (E11), Catalysts (E12), Crafting (E13), and Seals (E14).
`data/wishlist.ts` owns the wish list
resource's query identity, projection, and all six mutations; `data/collections.ts`
owns the collections resource's query identity and projection dispatch; `data/weekly.ts`
owns the weekly resource's query identity, endpoint, and the `enabled` gate the
two consumers previously composed themselves; `data/characters.ts` owns the
characters resource's query identity, endpoint, and projection (`toCharacter`,
moved from `lib/adapters.ts`), with `CharacterContext` surviving as a thin
selection-state wrapper over it; `data/items.ts` owns the two per-hash item
query identities and projections (`toGTItemView`, moved from `lib/adapters.ts`
and now private) and, by design, exposes no invalidation entry point — item
data is static per manifest version and carries no membership, so
`data/membershipRefresh.ts`'s fan-out has nothing to re-fetch here;
`data/search.ts` owns the global item search query identity, endpoint, the
two-character minimum, and projection to `SearchResult` (`toRarity` for the
rarity field), and by the same design exposes no invalidation entry point —
search reads the manifest index, not membership data; `data/flags.ts` owns the
resolved-flags query identity, endpoint, and projection (`toFlag`, through
`lib/roles.ts`'s `toTier`), exposing a
`refresh` callback rather than a module-level invalidation entry point, and by
the same design is outside `data/membershipRefresh.ts`'s fan-out — flags follow
the signed-in user's role, not Destiny membership data, and ADR 0017's identity
cleanup clears them on user change; `FlagsContext` survives as a thin gating
wrapper over it, the same pattern `CharacterContext` uses over
`data/characters.ts`. `data/admin.ts` owns the admin console's three query
identities (roster, flag configuration, per-type audit log) and both mutations
(`useSetMemberRole`, `useUpdateFlag`), projecting to `AdminUser`, `AdminFlag`
(`minTier` through the same `toTier`), and `AuditEntry`; the mutations stay
non-optimistic and each invalidates only its own key, taking framework-neutral
`onSuccess`/`onError` callbacks so `Admin.tsx` keeps its own toast copy and its
`useFlags().refresh()` follow-up outside this module. Admin's role and flag
mutations call `useFlags().refresh()` after their own mutation succeeds, rather
than invalidating `["flags"]` directly, which it did before this module existed;
Settings' self-service tier opt-in instead uses `data/flags.ts`'s
`useOptInTier`, which invalidates `["flags"]` itself on success, so Settings
calls no follow-up refresh. `data/catalysts.ts` owns the
catalysts resource's query identity, endpoint, and projection (`toCatalyst`),
exposing `invalidateCatalysts(client)` as its invalidation entry point;
`data/crafting.ts` mirrors it for the crafting-pattern resource
(`toCraftPattern`), exposing `invalidateCrafting(client)` — the two share the
Catalysts & Crafting page but not a resource. `data/seals.ts` owns the seals
resource's query identity, endpoint, and projection (`toSeal`/`toTriumph`/
`toObjective`), exposing `invalidateSeals(client)`; it is read by
`Triumphs.tsx`.
`data/membershipRefresh.ts` holds the
cross-resource cache-refresh fan-out over all six membership-scoped resources
(Catalysts, Characters, Collections, Crafting, Seals, Weekly); Search, Flags,
and Admin data are not membership-scoped, so none is part of that fan-out.
Consumers read these modules instead of declaring their own. ADR 0020 is fully
implemented as of E16 (`v1.3.54`): the `no-restricted-imports` import boundary
the ADR specifies is enforced by oxlint (see "Data fetching" below), and
`membershipRefresh.test.tsx`'s completeness guard fails if a membership-scoped
module is added without a matching invalidation entry point in
`membershipRefresh.ts`. `data/preferences.ts` (ADR 0021, E15) landed separately
and is the guard's one recorded exemption, not part of the fan-out by design —
see its "File structure" entry above.

## Authentication

`lib/browserSessionClient.ts` owns the browser session projection; the singleton
in `lib/browserSessionBrowser.ts` composes localStorage persistence, the API fetch
transport, and origin-wide Web Locks. Production callers share this instance.

- Access JWT and user snapshot are committed together in the versioned `guardian_browser_session` envelope. Valid legacy `guardian_token`/`guardian_user` pairs migrate once when no envelope exists, then the legacy keys are removed.
- Refresh tokens remain only in the host-only HttpOnly `guardian_refresh_token` cookie (30d, `SameSite=Lax`, `/api/auth`; `Secure` in production).
- `AuthProvider` subscribes with `useSyncExternalStore`; `useAuth()` returns `{ user, logout, logoutAll, isAuthenticated }`. Hydration performs no profile request or JWT decoding.
- Login and initial OAuth callback delegate to `beginAuthorization()` / `completeAuthorization()`; the callback page owns navigation.
- `apiFetch` delegates credential attachment and refresh to the client, then shapes REST responses/errors and Bungie reconnect routing. `BUNGIE_REAUTH_REQUIRED` preserves the app session.
- Web Locks serialize authorization start, callback, authenticated reconnect, refresh, and logout across tabs. Without them, authorization start, callback completion, authenticated reconnect, and refresh fail; logout still persists anonymous state, with remote cleanup best effort.
- Logout durably publishes an anonymous envelope before best-effort server cleanup. Storage events adopt newer session projections across tabs.

Read rendered auth state through `useAuth()` and make authenticated REST calls
through `apiFetch`. Keep credentials, persistence, and refresh inside the browser
session client/adapters; pages and hooks neither decode JWTs nor access credential
storage. JavaScript must never read the refresh cookie.

`AppProviders` composes the `applicationIdentity` observer outside the keyed
provider subtree. A transition to anonymous or a different Destiny membership
type/ID cancels and clears the old QueryClient, creates a replacement, remounts
the subtree (resetting onboarding, flags, character state, and page drafts),
and runs the registered `boundaryResets` — `preferencesClient.reset` (ADR 0021)
— so Preferences resets alongside the remount without itself being a provider.
Same-membership refresh retains caches and mounted state and runs no boundary
resets. `useIdentityMutation` guards delayed mutation starts and completion
callbacks; late cache work remains isolated in the retired client. Use the
current client from `useQueryClient()` for cache operations rather than
importing the initial client singleton.

## Roles and feature flags

`FlagsContext` (`contexts/FlagsContext.tsx`) is a thin gating wrapper (ADR 0020,
E10) over `data/flags.ts`'s `useResolvedFlags()` — it issues no query itself —
and exposes:

- `useFlag(key)` — returns `{ enabled, accessible, locked }` for a single flag key
- `useFlags()` — returns the full resolved flag map + caller's role

Use `useFlag` to gate UI — never make server-side enforcement decisions in the frontend based on role alone; that's the backend's job. `AppShell` reads `FlagsContext` to show/hide nav items and the admin console link.

`lib/roles.ts` exports role/tier constants, labels, and colors used by the admin kit components and the Settings tier opt-in flow.

## Protected routes

`App.tsx` groups authenticated pages under a single layout route, `ProtectedLayout`, which
wraps `AuthedProviders` (see `contexts/AppProviders.tsx` above), `AppShell`, and `<Outlet/>`:

```tsx
<Route element={<ProtectedLayout />}>
  <Route path="/dashboard" element={<Dashboard />} />
  <Route path="/guardian" element={<Guardian />} />
  <Route path="/collections" element={<Collections />} />
  {/* …this-week, catalysts, triumphs, wishlist, settings, admin */}
</Route>
```

`ProtectedLayout` reads from `useAuth()` and redirects to `/login` if not authenticated. New
authenticated pages go inside this group — do not add inline auth checks or re-wrap pages in
`AppShell` individually.

## Character context

`CharacterContext` (`contexts/CharacterContext.tsx`) is a thin selection-state
wrapper (ADR 0020, E7): it issues no query itself, reads the roster from
`data/characters.ts`'s `useCharacterRoster()`, and persists the active
character selection per Destiny membership. `useCharacters()` returns
`{ characters, activeCharacter, setActiveCharacter }` and throws when called
outside `CharacterProvider`, matching `useAuth`, `useFlags`, and
`usePreferences` — there is no silent `characters: []` default. Collections,
catalysts, and seals remain membership-wide. Dashboard and This Week include
the active character ID in weekly query keys and requests so authenticated
vendor context follows the selected character. Guardian passes the active
character ID to `useGuardianEquipment`; the data module supplies the signed-in
membership pair, so pages cannot select another membership.

## Preferences

`usePreferences()` (`data/preferences.ts`) is the sole owner of card style, the
"for you" badge preference, and Guardian Tracker user-backed onboarding
completion — [ADR 0021](../../docs/adr/0021-own-preferences-synchronization.md),
landed in E15 (v1.3.53). It is a framework-neutral client (`createPreferencesClient`),
not a React context: no `PreferencesProvider` exists, and `usePreferences()`
throws outside `AppProviders` instead of outside a preferences-specific provider.

The client synchronously hydrates one schema-versioned, revisioned localStorage
envelope (`guardian_preferences`) holding a single slot keyed by the current
Destiny membership; a membership change replaces the slot and anonymous removes
it (the pre-ADR-0021 global `guardian_prefs` key is deleted on load rather than
migrated). It reads exactly once per resolved membership, plus cross-tab
adoption of newer same-membership envelopes by monotonic revision. Writes are
optimistic, single-flight, and coalescing: at most one PUT is in flight, further
field changes coalesce into one queued patch, a failed patch rolls back and
surfaces a typed `PreferenceError` (`UNAVAILABLE | REJECTED | FAILED`) instead of
the old silent `.catch(() => {})`, and there is no automatic retry. Onboarding
completion goes through the same queue but is never optimistic — it resolves
only once the server confirms it. `onboardingRequired(resolution)` is the
fail-closed gate: only `resolved && persisted && onboarding === "required"`
shows the tour, so anonymous, unresolved, failed, and degraded reads never do.

`AppProviders` registers `preferencesClient.reset` as one of `createApplicationIdentity`'s
`boundaryResets`, so it resets exactly at identity boundaries (anonymous ↔
membership, or a different membership) the same way the QueryClient does, without
being remounted itself; same-membership refresh runs no boundary resets.
Preferences is exempt from `data/membershipRefresh.ts`'s fan-out by design — a
Bungie data refresh cannot change a Guardian Tracker setting.

## OAuth callback flow

`OAuthCallback.tsx` handles the redirect from Bungie at
`/auth/callback?code=...&state=...` for initial login and authenticated reconnect:

1. Reads `code` and `state` from URL params
2. For initial login, delegates `{ code, state }` to the shared client's
   `completeAuthorization()`. Its transport posts to `/api/auth/bungie/callback`
   with credentials; the API sets the refresh cookie, the client commits the
   access-token/user envelope, and the page redirects to `/dashboard`.
3. For reconnect, the non-secret intent and same-origin return path are held in
   `sessionStorage`. The callback uses `apiFetch` to authenticated-POST the code
   and state to `/api/auth/bungie/reconnect`, clears that intent after the 204,
   and returns to the saved path without replacing the Guardian Tracker session.
   If the app session disappeared while the browser was at Bungie, the callback
   clears the reconnect intent and completes a normal login instead.
4. On failure, shows the error and returns to `/reauthorize` for reconnect or
   `/login` for initial login.

## Collections page features

- Loads full data with `?include=all` (collected + missing) and filters display client-side via `missingOnly` toggle — no re-fetch when toggling the filter
- Supports search deep-link `?item=<hash>`: finds the item in any bucket (missing or collected) and opens the detail drawer; if no collectible entry exists, falls back to `data/items.ts`'s `useItemView` for a read-only view drawer
- Cosmetics is a full top-level category alongside Weapons, Armor, Exotics
- Add-to-wishlist and remove-from-wishlist use `data/wishlist.ts`'s `useAddWishlistItem`/`useRemoveWishlistItem` (ADR 0020), with a page-local pending-state guard (prevents double-click races) and the row resolved from the projected `WishlistEntry.itemId` rather than reaching into the wire cache. Remove is now optimistic here too — the wish-list star clears on click rather than on the refetch that follows, unifying with the Wish list page's behavior (previously non-optimistic on this page only)
- Filter/category state (rarity, source difficulty, sort, view, missing-only, "available now", "hide farm-only", the in-page search term, and the selected category), the `?item=` deep link, and the open detail drawer are all owned by one hook, `useCollectionsBrowser(collections, { onItemUnavailable })` (`features/collections/useCollectionsBrowser.ts`, F4). It makes the URL the source of truth: `parseFilters`/`serializeFilters` read and write `?node=&q=&rarity=&diff=&sort=&view=&missing=&avail=&farm=`, keeping the URL shareable and reload-safe. The difficulty predicate matches when any `acquisitionSources` entry has the selected tier. Sort supports rarity, name, and availability; a legacy URL `sort=difficulty` parses as rarity, while `loadStoredFilters` drops that removed value and the next persistence pass writes the rarity default without discarding other valid saved fields. Filter fields also mirror to a `gt.collections.filters` localStorage entry, which supplies defaults only when the URL carries no filter params (e.g. a fresh visit). `node` and `q` are the two keys in `URL_ONLY_KEYS`: never persisted to storage, never read back from it, and re-asserted from the URL everywhere stored/legacy state is merged in — a bare `?node=` or `?q=` deep link still applies the user's stored filter defaults, and a stray `q`/`node` key in a hand-edited or legacy localStorage payload can't leak into state.
  The hook exposes five intents instead of per-field setters: `selectNode(node)` (push, so Back returns to the previous category), `setFilter(patch)` (replace, for typing/toggling), `clearFilters()` (replace), `openItem(item)`, and `closeDetail()`. Every URL write is computed from a ref of the latest params rather than the render's snapshot — react-router's functional `setSearchParams` updater handed same-tick writes the same stale `prev`, so multiple intents in one handler used to clobber each other; that hazard is now structurally gone rather than a calling convention (the old `setFilters`-for-atomic-changes rule no longer applies). It returns `filters`, `items` (filtered + sorted), `activeNode`, `expandPath` (the ancestors to open in the tree), `detail`, `searching`, and `hasFilters`. Deep-link reconciliation (`reconcile`) runs as a pure function once collections data is available: it opens `?item=<hash>` when the item is found, falls back through `data/items.ts`'s `useItemView` for a view-only lookup when it isn't, or seeds the first root when there's no valid `node` — a pending deep link always wins over seeding. `Collections.tsx` renders this state and has zero `useEffect`s of its own. The pure pieces (`parseFilters`, `serializeFilters`, `effectiveFilters`, `nextParams`, `intentWrite`, `reconcile`, `visibleItems`, `revealPath`) are exported and table-tested in `useCollectionsBrowser.test.tsx`.
- Collection cards have no item-level difficulty badge: one acquisition source shows
  its text and multiple sources show a neutral count. `ItemDetailDrawer` lists every
  source with its own difficulty tier. `availableNow` stays a separate live-vendor
  join.
- The Collections toolbar's "Search this category…" field (`type="search"`, `aria-label`, 100-char `maxLength`) filters the currently-loaded category's items by case-insensitive name substring match, purely client-side over the already-fetched `?include=all` payload — it does not call `/api/items/search`. It composes with every other filter/sort as another predicate, is cleared by "Clear filters," and drives a search-specific empty state that names the term (`No items match "<term>"`).

## Wishlist page features

- `WishListItem` includes `icon`, `acquisitionSources`, `availableNow` (live-vendor cross-check), and `availableFrom`
- `ItemTile` renders the Bungie CDN icon when present
- Inline notes editor: click to edit, optimistic update with rollback on error, 500 char max
- All mutations (add, remove, set priority, set notes, bulk) come from `data/wishlist.ts` (ADR 0020); the page supplies only toast copy through each hook's `onSuccess`/`onError`/`onSettled` callbacks — it no longer owns cache reads, writes, or rollback itself

## API response type changes

- `APIAcquisitionSource`: `{ text, difficulty, raidDungeon }`; `APIDestinyItem`
  and `WishListItem` expose `acquisitionSources` and no item-level difficulty.
- `APIMembershipCollections`: `+ fetchedAt: string`
- `APICollectionSummary`: `+ collectedItems?: APIDestinyItem[]`
- `APIRecordsEnvelope<T>`: `{ items: T[]; fetchedAt: string }` — envelope for catalysts/crafting/seals
- `Weekly`: `+ resetAt`, `+ fetchedAt`, `+ degraded?`
- `XurItem.className?: string` — manifest-defined armor class; the Xûr module labels it and highlights a match with the active character
- `APIPreferences.onboardedAt: string | null` — server-authoritative onboarding completion; `usePreferences().completeOnboarding()` (`data/preferences.ts`) persists it with `onboardingComplete:true`
- `APIPreferencesRead extends APIPreferences` — `+ persisted: boolean` on `GET /api/preferences` (ADR 0021); `false` marks unstored defaults returned because persistence is unavailable, distinguishing that from a genuinely new account (`persisted: true` with `onboardedAt: null`)
- `Milestone.missing`: `number | undefined` — populated for raid/dungeon milestones;
  verified current non-raid rewards contain no collectible-linked items, so others omit it.
- `APIPerkColumn`: `{ role: string; label: string; perks: string[] }` — one column of the weapon perk pool
- `APIItemCatalyst`: `{ name: string; description: string }` — one exotic catalyst entry; `description` may be empty (the manifest has at least one blank entry — Duality)
- `APIItemPerks`: `{ itemHash: number; perkColumns: APIPerkColumn[]; catalysts: APIItemCatalyst[] }` — response envelope for `/api/items/:itemHash/perks`; `catalysts` is always present (empty array for non-exotics), up to 4 entries for multi-catalyst exotics
- `GTItem.perks`: REMOVED — the old dead flat perks field no longer exists on the design type; use `PerkColumn[]` from `data/items.ts`'s `useItemPerks` instead
- `GTItem.farmOnly?: boolean` — set when the collectible source indicates "cannot be reacquired"; renders a "Farm only" chip in the item card and drawer
- `GTItem.acquisitionSources: AcquisitionSource[]`; no aggregate `GTItem.diff`.
  Farm-only semantics are unchanged and must not be redefined from the source union.
- `APIItemView`: `{ itemHash, name, icon, itemType, tierType, rarity, description }` — response type for `GET /api/items/:itemHash`; used by `data/items.ts`'s `useItemView` for the view-only deep-link drawer
- `PerkColumn` (design.ts): `{ role: string; label: string; perks: string[] }` — design-layer parallel to `APIPerkColumn`
- `ItemCatalyst` (design.ts): `{ name: string; description: string }` — design-layer parallel to `APIItemCatalyst`; passed to `ItemDetailDrawer`'s `catalysts` prop
- `Catalyst.effect?: string` (design.ts) — catalyst perk/effect text on the `/api/catalysts/...` response; rendered on `Catalysts.tsx` cards when present
- `Triumph.objectives?: TriumphObjective[]` (design.ts) — optional per-objective drill-down on `/api/seals/...` triumphs; `TriumphObjective { label, done, cur, max }`; absent (not an empty array) when the triumph has no objective data, so existing triumphs render unchanged
- `WishlistEntry.itemId: string` (design.ts) — the wished item's hash, matching `GTItem.id`; lets Collections match its tiles against the wish list from the projected entry instead of the wire `WishListItem.itemHash`

## Styling

The app uses the **Guardian Tracker design system**, not Tailwind utilities:

- Design tokens (oklch colors, fluid type, spacing, radii) live in `src/styles/tokens.css`; component and shell styles in `kit.css` / `app.css`; admin console styles in `admin.css`. These are imported once in `index.tsx`.
- Style with the `gt-*` class vocabulary (e.g. `gt-card`, `gt-panel`, `gt-item`, `gt-badge`). Reach for the shared components in `components/` (`primitives`, `composite`, `Icon`) before writing markup by hand.
- Rarity/difficulty theming: set `data-rarity` (`exotic|legendary|rare|uncommon|common`) or `data-diff` (`easy|moderate|challenging`) on a wrapper; children read the resolved `--rarity` / `--diff` custom properties.
- Dynamic numeric values are passed as inline CSS custom properties (e.g. `style={{ "--val": pct }}`), cast as needed. Avoid other inline styles where a `gt-*` class exists.
- Layout is fixed: sidebar nav, comfortable density, cyan "signal" accent. Tailwind is still installed for the `LoadingSpinner` / `Toast` primitives and `ErrorBoundary` only — do not add new Tailwind-styled UI.
- User-adjustable prefs (card style, "for you" badges) come from `usePreferences()` — do not hardcode them.

## Testing

- Framework: Vitest + React Testing Library
- Setup file: `src/test/setup.ts` (MSW server + fixtures in `src/test/testServer.ts`)
- Tests are colocated with the code they cover: lib tests in `lib/`, component tests in `components/`, and each feature's page tests inside `features/<feature>/`
- Data-access modules (`src/data/`) get contract tests colocated as `<resource>.test.tsx` (e.g. `data/wishlist.test.tsx`), exercising the public hooks — not the private projection function — for query identity/shape, projection, and optimistic rollback/settle behavior (ADR 0020). Feature tests for a migrated resource drop wire-shape assertions and keep visible behavior only. `data/membershipRefresh.test.tsx` (E16) additionally reads every `data/*.ts` module's source via `import.meta.glob` and fails if a module reading the signed-in membership has neither a matching `invalidate<Resource>` entry point wired into `fanOut` nor a named entry in `REFRESH_EXEMPTIONS`.
- `renderWithProviders` (`src/test/renderWithProviders.tsx`) is the standard way to render a page under test — it mounts `ui` inside `AppProviders` + `MemoryRouter`, and, when `authed` (default `true`), also wraps `AuthedProviders` and seeds the atomic browser-session envelope with `seedBrowserSession` (`src/test/browserSession.ts`). Options: `route`, `initialEntries`, `initialIndex`, `authed`, `client` (a fresh retry-disabled `QueryClient` by default). Pass a `<Routes>` element as `ui` when a test needs real route matching. Three test files deliberately keep their own hand-rolled tower instead of `renderWithProviders`: `contexts/contexts.test.tsx` (tests the contexts directly), `features/auth/OAuthCallback.test.tsx` (needs `StrictMode` mounted as a double-invoke regression guard), and `lib/units.test.tsx` (renders providers in isolation). Reach for `renderWithProviders` for any new page test rather than hand-rolling a tower.
- Run: `npm test` (from `frontend/`)
- Test behavior, not implementation: prefer `getByRole`, `getByText`, `findBy*` over snapshot tests
- Mock `AuthContext` when testing pages that call `useAuth()`
- Do not use `MockedProvider` from Apollo — there is no Apollo Client in this project
- Browser suites live under `frontend/e2e/` and use Playwright (version pinned in `frontend/package.json`) plus `@axe-core/playwright`. Run `npm run e2e` for functional + accessibility + destructive-auth projects and `npm run e2e:visual` for visual comparison.
- Start `docker compose --profile e2e up -d --wait e2e-postgres` first and set `E2E_FIXED_TIME=2026-07-18T18:00:00Z`. Playwright launches fake Bungie, the real API, and Vite; never substitute live Bungie calls.
- Keep `workers: 1` because fixtures mutate shared Guardian Tracker user/scenario state. Destructive logout tests run only after functional and accessibility projects.
- CI has exactly one retry for functional/axe, traces on the first retry, and retains reports/screenshots/video/diffs for 14 days. Visual baselines use 1440x900 Chromium in the `mcr.microsoft.com/playwright` image pinned by `ARG PLAYWRIGHT_IMAGE` in `frontend/Dockerfile.playwright`, and stay advisory. That pin must track `@playwright/test`; `npm run sync:image-pins` from the repo root resolves the tag to its current registry digest and rewrites it — the policy test fails the build when it drifts.

## Known limitations / TODOs

- `logout()` ends only the current Guardian Tracker session; other devices remain signed in and the membership-wide Bungie authorization is preserved. `logoutAll()` ends all sessions and evicts the Bungie authorization. If revocation cannot be observed immediately, the old access token expires within the configured lifetime (30 minutes by default) plus the 60-second cache window
- Search index snapshots persist beside the manifest by version; pages can still show a "warming up" error state while a missing or new-version snapshot rebuilds (~30s)
- Xûr location is optional — the backend resolves the authenticated vendor location to
  `The Tower` and omits the field when Bungie or manifest data is unavailable.
- Raid and dungeon milestones carry a real missing count; non-raid/dungeon milestones
  omit it because verified current reward definitions contain no collectible-linked items.
