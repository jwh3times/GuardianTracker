developer_instructions = '''
You are working inside the Guardian Tracker React frontend (`frontend/src/`). Know these patterns and enforce them without deviation.

## Stack

React + TypeScript + Vite + **TanStack React Query** (REST, not GraphQL). All source in `frontend/src/`. There is no Apollo Client and no GraphQL layer.

Routing is **React Router v8**. Import from `react-router` — `react-router-dom` was removed in v8 and is not installed, so an import from it fails to resolve. The app routes declaratively (`<BrowserRouter>` + `Routes`/`Route`, `MemoryRouter` in tests); there is no data router, so no `createBrowserRouter`, `RouterProvider`, loaders, or actions.

The UI uses the custom **Guardian Tracker design system**: oklch design tokens + `gt-*`
CSS classes in `src/styles/{tokens,kit,app,admin}.css`, with reusable design-system
components in `components/` (`primitives.tsx`, `composite.tsx`, `Icon.tsx`). Build new UI
from these components and `gt-*` classes — not Tailwind utilities. The design source
prototype lives in `frontend/design/` (do not import from it at runtime).

The frontend is organized **feature-first**: each feature owns its pages, feature-only
components, lib helpers, and tests under `src/features/<feature>/`. Truly shared building
blocks live in `components/` (design system), `lib/` (cross-cutting helpers), `contexts/`,
`types/`, and `styles/`.

Dev commands (run from `frontend/`):

```powershell
npm start          # Vite dev server on :5273
npm run build      # tsc + Vite production build
npm test           # Vitest
npm run lint       # Oxlint, including type-aware TypeScript checks
npm run lint:fix   # Apply safe Oxlint fixes
```

Oxlint is the sole linter. Type-aware analysis uses `oxlint-tsgolint` 7.0.2001;
23 rules from typescript-eslint's `recommended-type-checked-only` preset run as
warnings for `src/`, `vite.config.ts`, and all 10 TypeScript files under `e2e/`.
They expose the type-safety cleanup backlog without blocking CI.
`playwright.config.ts` remains native-rule-only because tsgolint does not match
it even though `frontend/e2e/tsconfig.json` includes it. The root TypeScript
configuration includes Node ambient types, and the e2e project extends it.
Native `react/react-compiler` also runs as a warning and replaces the individual
recommended-latest compiler rules; preserve that intentional severity and
suppression policy. TypeScript 7 is the project compiler; `npm run type-check`
(`tsc --noEmit`) remains the main frontend project's type gate, and Prettier
remains the formatter. The standalone e2e project currently reports six
pre-existing Playwright fixture typing errors under both TypeScript 6 and 7;
treat those as separate cleanup rather than a compiler-upgrade regression.

