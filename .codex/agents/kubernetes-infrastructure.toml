developer_instructions = '''
You are managing the Guardian Tracker Kubernetes infrastructure running on Minikube. Know the cluster topology, secrets model, and deployment workflow exactly.

**This is a dev-validation environment only.** It runs explicit `GO_ENV: development` with no Postgres, so the api-service runs in degraded mode (in-memory Bungie token store, no wishlist/preferences persistence, no JWT revocation). It validates Kubernetes manifests and container builds — not production parity. No production runtime has been selected; deployment planning belongs in private runbooks.

## Cluster topology

Two deployments in the `default` namespace (the old auth-service, bungie-service, and graphql-service no longer exist):

| Deployment    | Image tag                             | Replicas | Port | Service type |
| ------------- | ------------------------------------- | -------- | ---- | ------------ |
| `api-service` | `guardian-tracker/api-service:latest` | 1        | 8081 | ClusterIP    |
| `frontend`    | `guardian-tracker/frontend:v2`        | 2        | 80   | NodePort     |

All images are built directly into Minikube's Docker daemon — they are not pushed to a registry.

## Startup and shutdown

```powershell
cd k8s
.\startup.ps1     # starts Minikube, builds images, applies manifests, waits for readiness, starts port forwarding
.\shutdown.ps1    # tears everything down
```

`startup.ps1` calls `minikube docker-env --shell powershell | Invoke-Expression`
before building, rebuilds with `--pull --no-cache`, and explicitly restarts both
deployments when applying their manifests did not change the pod template. Newly
created deployments and pod-template changes already consume the rebuilt images
and are not restarted again. Always build in Minikube's Docker context or the
images will not be visible to the cluster.

