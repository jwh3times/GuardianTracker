## Secret — api-service-secrets

Runtime values for api-service are wired through the ignored, machine-local
`api-service-secret.yaml`. `BUNGIE_CLIENT_ID` is a public identifier, but this
Minikube validation setup keeps it in the same Kubernetes Secret for wiring
convenience. Run the root `setup.ps1` or copy the committed example before the
first startup, then replace all placeholders locally:

```powershell
cp k8s/api-service-secret.yaml.example k8s/api-service-secret.yaml
# Edit the ignored local file, then apply it.
kubectl apply -f k8s/api-service-secret.yaml
```

| Secret key         | Purpose                                                      |
| ------------------ | ------------------------------------------------------------ |
| `BUNGIE_API_KEY`   | Bungie API requests                                          |
| `BUNGIE_CLIENT_ID` | Public OAuth client identifier; no client secret is used     |
| `JWT_SECRET`       | HS256 JWT signing key; also derives the OAuth state HMAC key |

Note: `DATABASE_URL` and `TOKEN_ENCRYPTION_KEY` are not in the Minikube secret because the stack runs in development mode without Postgres. Do not treat this omission or these manifests as production guidance.

After editing the ignored local Secret, apply it and restart the API:

```powershell
kubectl apply -f k8s/api-service-secret.yaml
kubectl rollout restart deployment/api-service
```

## Port forwarding

The frontend is accessed via kubectl port-forward to `localhost:5273`:

```powershell
Start-Job -ScriptBlock { kubectl port-forward service/frontend 5273:80 }
```

`startup.ps1` starts this automatically. Access the app at **http://localhost:5273**.

## Building images

Images must be built inside Minikube's Docker daemon:

```powershell
& minikube docker-env --shell powershell | Invoke-Expression

docker build --pull --no-cache -t guardian-tracker/api-service:latest backend/api-service/
docker build --pull --no-cache -t guardian-tracker/frontend:v2 frontend/

kubectl rollout restart deployment/<name>
kubectl rollout status deployment/<name> --timeout=120s
```

Both deployments use `imagePullPolicy: Never` because images are built into
Minikube's daemon rather than pulled from a registry. Images must exist there
before applying manifests, and existing deployments must restart after reused
tags are rebuilt unless the apply already changed the pod template. Do not start
a second rollout while api-service initializes or opens the shared manifest
volume.

## Useful kubectl commands

```powershell
# Cluster status
kubectl get pods
kubectl get services
kubectl get deployments

# Debug a pod
kubectl logs <pod-name>
kubectl logs <pod-name> --previous     # if pod crashed
kubectl describe pod <pod-name>

# Watch rollout
kubectl rollout status deployment/api-service --timeout=300s

# Delete and recreate all resources (from k8s/)
kubectl delete -f .
kubectl apply -f .
```

## Bungie OAuth and ngrok

Bungie OAuth requires a public HTTPS redirect URI. For local development:

1. Start ngrok: `ngrok http 5273`
2. Copy the HTTPS URL (e.g. `https://abc123.ngrok-free.app`)
3. Update the Bungie app settings at https://www.bungie.net/en/Application
4. Update `AUTH_REDIRECT_URI` in `k8s/api-service-configmap.yaml` to `https://abc123.ngrok-free.app/auth/callback`
5. Apply the config map and restart the API with the commands in the ConfigMap
   section above.

## Base image pins

Read exact base-image refs from the application Dockerfiles; do not cache their
versions here. Runtime and frontend builder refs remain pinned to reviewed
multi-platform OCI index digests. Use the drift-verification procedure in
