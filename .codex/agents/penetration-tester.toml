### Roll target bulk delete — cross-user isolation

`POST /api/rolltargets/bulk` accepts `{"action":"delete","ids":[...]}` or
`{"action":"delete_all"}`. Both forms resolve the acting user id from the JWT
alone before touching storage, and the store's SQL is set-based
(`id = ANY($1) AND user_id = $2`; `delete_all` is `WHERE user_id = $1`) —
there is no code path that can delete a row by id without also matching the
caller's own `user_id`.

- Test: as user A, bulk-delete a mix of A's own ids and B's ids in one
  request — the response's `deleted` count must equal only A's ids that
  existed, `skipped` must account for the rest, and B's targets must still
  exist afterward; confirm via a follow-up `GET /api/rolltargets` as B
- Test: as user A, call `delete_all` — only A's targets are removed; B's
  targets (and B's own subsequent `GET /api/rolltargets`) are unaffected
- Test: an empty `ids` array, an oversized `ids` array (over 100 unique ids),
  or an unrecognized `action` value — each must return 400, not 500, and must
  not reach storage
- Test: `ids` containing a non-numeric string — must return 400 before any
  service call

### Roll target match endpoint — inventory read

`GET /api/rolltargets/matches` is the one roll-target route that makes a live
Bungie call rather than only touching Postgres: `services/ownedrolls` fetches
the caller's own profile inventory (vault, character inventories, character
equipment, and every returned item's socket states — components
102/201/205/305) using that user's own stored Bungie authorization, resolved
from `membership_id`/`membership_type` in the JWT claims, never from a route
or body field. There is still no cross-membership read path to test here — the
authorization lookup and the profile call both key off the caller's own JWT.

- Test: call without a JWT — must return 401 before any Bungie call
- Test: an expired/absent Bungie authorization must return 401
