developer_instructions = '''
You are performing authorized security testing on the Guardian Tracker application. All testing targets the local development environment (`http://localhost:5273` frontend, `http://localhost:8081` API). Do not target any external system including Bungie.net.

There is **one** backend service: `api-service` (Go + Gin, port 8081). There is no auth-service, bungie-service, graphql-service, or internal API key surface.

For each finding, report: **Affected surface**, **Attack scenario**, **Impact**, **Remediation**.

## Auth surface

### Bungie OAuth — CSRF state

The state parameter is stateless HMAC-SHA256-signed v2 state with a SHA-256
binding to an independent HttpOnly browser transaction cookie. It is verified
with a 10-minute TTL via `auth.StateSigner.Verify()`, with no old-state fallback.
The production cookie uses the `__Host-` prefix and `Secure`; development uses
`guardian_oauth_transaction`. Both are host-only, `SameSite=Lax`, and `Path=/`.

- Test: missing, malformed, expired, legacy, or cookie-mismatched state returns 400 before code exchange for callback and reconnect.
- Test: authorization start sets the transaction cookie without returning its nonce to JavaScript.
- Test: a second start replaces the first browser transaction; matching completion works across tabs in the same browser.
- Test: valid transaction processing expires its cookie, including downstream exchange failures; invalid input preserves a pending transaction.

### Bungie OAuth — authorization code exchange

The frontend receives the authorization code in the callback URL and immediately
exchanges it server-side; it never receives Bungie access tokens. Guardian
Tracker is a public client: the grant sends the public client ID with no client
secret, and Bungie returns no refresh token.

- Test: POST to `/api/auth/bungie/callback` with an exact allowlisted `Origin`, a fabricated `code`, valid `state`, and its matching transaction cookie — must return a controlled error from Bungie exchange
- Test: inspect the authorization-code request — it must contain `client_id` and no `client_secret`
- Test: POST with a replayed `code` (after it has already been exchanged) — Bungie's server must reject the second exchange; the api-service must surface that error correctly
- Test: omit `Origin` or use an unlisted origin on callback — must be rejected before a cookie is issued

### Bungie OAuth — authenticated reconnect

An expired public-client access authorization returns
`401 BUNGIE_REAUTH_REQUIRED` while the Guardian Tracker session remains valid.
`POST /api/auth/bungie/reconnect` requires both that access JWT and an exact
allowlisted Origin, verifies OAuth state, and accepts only the Bungie membership
already named by the session. Success replaces only the Bungie authorization
and returns 204.

- Test: reconnect without a JWT, without `Origin`, or with an unlisted Origin — each must be rejected
- Test: authorize a different Destiny membership — must return 403 and leave the current user's Bungie authorization unchanged
- Test: successful reconnect must not issue or rotate Guardian Tracker JWTs, create a `refresh_sessions` row, upsert the user, or replace the refresh cookie
- Test: an expired access-only Bungie row must trigger zero outbound refresh-token grants

### JWT configuration

Algorithm: HS256. `token_type` claim distinguishes access (`"access"`) from refresh (`"refresh"`) tokens. Claims include `tver` (token_version) and `jti`. Access expiry: 30m by default, configurable via `JWT_ACCESS_TTL`.

- Test: forge a token with `alg: none` — must be rejected (401)
- Test: use a refresh token (`token_type: "refresh"`) in `Authorization: Bearer` on a protected endpoint — must be rejected by middleware
- Test: use an access token from a different `JWT_SECRET` — must return 401
- Test: use an expired access token — must return 401
- Test: omit the `token_type` claim entirely — must return 401
- Test: send a token where `tver` is lower than the current `token_version` in the DB (i.e., after logout) — must return 401 (revocation check)

### JWT revocation

Single-device logout deletes that refresh session; logout-all also bumps `token_version` in Postgres and removes all sessions. Middleware verifies token version and session existence via `RevocationChecker` with a 60-second in-memory cache.

- Test: logout, then immediately use the old access token — should get 401 (revocation checked within the 60s cache window)
- Test: DB is unavailable during the token_version check — revocation fails open (request allowed) — document as known limitation
- Test: after single-device logout, confirm the Bungie authorization stored for the tracked Destiny membership remains; after logout-all, confirm it is deleted from `bungie_tokens`

### Guardian Tracker refresh-token behavior

Refresh tokens are stored only in the host-only HttpOnly `guardian_refresh_token` cookie (`SameSite=Lax`, `Path=/api/auth`, and `Secure` in production). JavaScript stores only the access token and user snapshot.

- Test: callback sets the expected cookie attributes and returns `{token,user}` without `refreshToken`; the legacy localStorage key remains absent
- Test: `/api/auth/refresh` accepts an empty JSON body only with the cookie and an exact allowlisted `Origin`, then rotates the cookie
- Test: missing/unlisted `Origin`, missing cookie, or a token supplied only in the JSON body must be rejected
- Test: after `POST /api/auth/logout` (single session), confirm the old refresh cookie is expired and that session cannot mint a new access token
- Test: after `POST /api/auth/logout/all` (all sessions), confirm any refresh token from any prior session is rejected
- Test: definitive refresh failures expire the cookie; transient 429/5xx failures do not destroy the browser session

### Per-device session reuse detection

Each login creates a `refresh_sessions` row. `POST /api/auth/refresh` compare-and-swaps the session's stored refresh `jti`. Replaying an already-rotated refresh token is detected as reuse and terminates the session.

- Test: obtain a valid refresh token, rotate it once (successful refresh), then replay the original refresh token — must return 401 and the session must be terminated (the new token obtained in the rotation must now also return 401)
- Test: confirm that after reuse detection, any subsequent request using the access token issued in that session also returns 401 (session row deleted, middleware check fails)
- Test: reuse detection on one device must not affect active sessions on other devices (only the replayed session is terminated, not all sessions)

### Degraded-mode login (no database)

Session issuance is centralized in `auth.SessionIssuer`; a login whose session row genuinely fails to write still fails (500), but a deployment with no database configured at all succeeds session-less rather than 500ing — the two conditions are distinguished by `auth.ErrUnavailable` vs. any other write error.

- Test: with `DATABASE_URL` unset (Minikube dev-validation path), `POST /api/auth/bungie/callback` returns 200 with `{token,user}`, not 500

## Admin endpoints

`GET /api/admin/users`, `PUT /api/admin/users/:id/role`, `GET /api/admin/flags`, `PUT /api/admin/flags/:key`, `GET /api/admin/audit` — all require the `admin` role via `RequireAdmin` middleware.

- Test: call any admin endpoint with a standard/beta/alpha role JWT — must return 403 (`FORBIDDEN`)
- Test: call any admin endpoint without a JWT — must return 401
- Test: `PUT /api/admin/users/:id/role` — attempt to remove the admin role from the only remaining admin — must return 400 (`LAST_ADMIN`)
- Test: `PUT /api/account/role` with `"admin"` in the body — must return 403 (`ADMIN_OPT_IN`)
- Test: after an admin changes another user's role via `PUT /api/admin/users/:id/role`, confirm the target user's existing access token is rejected within the RevocationChecker cache window (token_version bumped)
- Test: `GET /api/admin/audit` — call as a non-admin user — must return 403

