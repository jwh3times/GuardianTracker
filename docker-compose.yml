# Guardian Tracker — full local stack (production-style images).
#
#   1. cp .env.example .env   and fill in BUNGIE_* secrets
#   2. docker compose up --build
#
# Frontend:  http://localhost:5273   API: http://localhost:8081   pgAdmin: http://localhost:5150
#
# The frontend's VITE_ URLs intentionally stay on localhost — they run in the
# browser on the host, not inside a container.

services:
  postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardian_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Default host port 5532 is offset from the canonical 5432 to avoid colliding
      # with other local projects. Override with POSTGRES_PORT. Container always listens on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5532}:5432"
    volumes:
      # PostgreSQL 18+ images store data under a version-specific subdir, so the
      # recommended mount point is /var/lib/postgresql (not /var/lib/postgresql/data).
      - postgres-data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-guardian_tracker}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@guardiantracker.gg}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # Skip the email-format / master-password prompts for local dev.
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      # Host port 5150 is offset from the canonical 5050 to avoid collisions. Override with PGADMIN_PORT.
      - "127.0.0.1:${PGADMIN_PORT:-5150}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-service:
    build:
      context: ./backend/api-service
    ports:
      - "${API_SERVICE_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      GO_ENV: ${GO_ENV:?set GO_ENV to development or production}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      BUNGIE_API_KEY: ${BUNGIE_API_KEY:-}
      BUNGIE_API_BASE_URL: https://www.bungie.net/Platform
      BUNGIE_CLIENT_ID: ${BUNGIE_CLIENT_ID:-}
      BUNGIE_CLIENT_SECRET: ${BUNGIE_CLIENT_SECRET:-}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://localhost:5273/auth/callback}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me_minimum_32_characters_long}
      JWT_ACCESS_TTL: "30m"
      JWT_REFRESH_EXPIRY_DAYS: "30"
      MANIFEST_DB_PATH: /app/data/manifest.sqlite
      BUNGIE_API_RPS: "10"
      BUNGIE_API_BURST: "20"
      CACHE_ENABLED: "true"
      CACHE_TTL_COLLECTIONS: "300"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5273}
      DATABASE_URL: postgres://guardian_app:guardian_dev_password@postgres:5432/guardian_tracker?sslmode=disable
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      TOKEN_ENCRYPTION_KEY_VERSION: ${TOKEN_ENCRYPTION_KEY_VERSION:-1}
      TOKEN_ENCRYPTION_KEY_PREVIOUS: ${TOKEN_ENCRYPTION_KEY_PREVIOUS:-}
      TOKEN_ENCRYPTION_KEY_PREVIOUS_VERSION: ${TOKEN_ENCRYPTION_KEY_PREVIOUS_VERSION:-}
      ADMIN_MEMBERSHIP_IDS: ${ADMIN_MEMBERSHIP_IDS:-}
    volumes:
      - manifest-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Host port 5273 (was 3000). This host port doubles as the OAuth redirect
      # origin — keep it in sync with AUTH_REDIRECT_URI / CORS and the Bungie app.
      - "${FRONTEND_PORT:-5273}:8080"
    depends_on:
      api-service:
        condition: service_healthy
    restart: unless-stopped

  # ── Test-only ──────────────────────────────────────────────────────────────
  # Throwaway Postgres for the Go test suite (backend/api-service/test-local.ps1).
  # Gated behind the "test" profile, so a plain `docker compose up` never starts
  # it — it runs only when explicitly targeted:
  #     docker compose --profile test up -d test-postgres
  # Defining it here (rather than a bare `docker run`) gives it the Compose project
  # label, so Docker Desktop groups it with the rest of the stack. Mapped to 5533
  # (sits next to the dev `postgres` port at 5532) so it never collides. No volume:
  # removing the container wipes the data — it's disposable (tests recreate schema + rows).
  test-postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    profiles: ["test"]
    container_name: gt-test-pg
    environment:
      # Must stay in sync with the creds in test-local.ps1 (TEST_DATABASE_URL).
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5533}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  # Hermetic browser-suite database. Playwright owns the fake Bungie service,
  # real API, and Vite processes; Compose supplies only an isolated Postgres.
  # No data volume is attached, so removing the container resets every scenario.
  e2e-postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    profiles: ["e2e"]
    environment:
      POSTGRES_DB: guardian_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-5534}:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guardian_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

volumes:
  postgres-data:
  manifest-data:
