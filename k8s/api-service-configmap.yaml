apiVersion: v1
kind: ConfigMap
metadata:
  name: api-service-config
  namespace: default
data:
  PORT: "8081"
  # The Minikube stack is a dev-validation environment only: it has no Postgres,
  # so the api-service runs in degraded mode (in-memory token store, no persistence).
  # Production deploys to Azure Container Apps, where GO_ENV=production requires
  # DATABASE_URL and TOKEN_ENCRYPTION_KEY secrets.
  GO_ENV: "development"
  BUNGIE_API_BASE_URL: "https://www.bungie.net/Platform"
  # Update when using ngrok or a custom domain for OAuth. 5273 matches the frontend
  # port-forward in startup.ps1 so a single Bungie redirect URI covers docker + k8s.
  AUTH_REDIRECT_URI: "http://localhost:5273/auth/callback"
  CORS_ALLOWED_ORIGINS: "http://localhost:5273"
  MANIFEST_DB_PATH: "/app/data/manifest.sqlite"
  MANIFEST_CHECK_INTERVAL: "3600"
  BUNGIE_API_RPS: "10"
  BUNGIE_API_BURST: "20"
  CACHE_ENABLED: "true"
  CACHE_TTL_COLLECTIONS: "300"
  JWT_ACCESS_TTL: "30m"
  JWT_REFRESH_EXPIRY_DAYS: "30"
  # Comma-separated Bungie membership IDs pinned to the admin role at login.
  # Inert in this dev-validation stack (no Postgres → roles run degraded as
  # standard and admin endpoints return 503); set for real in the Azure deploy.
  ADMIN_MEMBERSHIP_IDS: ""
