apiVersion: apps/v1
kind: Deployment
metadata:
  name: bungie-service
  namespace: default
  labels:
    app: bungie-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bungie-service
  template:
    metadata:
      labels:
        app: bungie-service
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bungie-service
          image: guardian-tracker/bungie-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: PORT
              value: "8082"
            - name: GO_ENV
              value: "production"
            - name: BUNGIE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: BUNGIE_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bungie-service
  namespace: default
  labels:
    app: bungie-service
spec:
  selector:
    app: bungie-service
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bungie-service-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bungie-service
