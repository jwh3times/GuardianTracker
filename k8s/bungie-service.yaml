apiVersion: apps/v1
kind: Deployment
metadata:
  name: bungie-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bungie-service
  template:
    metadata:
      labels:
        app: bungie-service
    spec:
      containers:
        - name: bungie-service
          image: guardian-tracker/bungie-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: bungie-service
  namespace: default
spec:
  selector:
    app: bungie-service
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
  type: ClusterIP
