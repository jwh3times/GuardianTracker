apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: default
data:
  # Non-sensitive configuration only
  # Sensitive values moved to auth-service-secrets Secret
  PORT: "8081"
  GO_ENV: "development"
  # Update these URLs when using ngrok or a custom domain for OAuth
  AUTH_REDIRECT_URI: "http://localhost:3000/auth/callback"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
